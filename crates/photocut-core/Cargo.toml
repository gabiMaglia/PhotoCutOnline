[package]
name = "photocut-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Interactive foreground extraction (GrabCut) engine. Permissively licensed."

[dependencies]
# image: MIT/Apache-2.0 — decode/encode PNG/JPEG/BMP/etc.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
# nalgebra: Apache-2.0 — linear algebra for the GMM covariance math
nalgebra = "0.33"
# thiserror: MIT/Apache-2.0
thiserror = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
