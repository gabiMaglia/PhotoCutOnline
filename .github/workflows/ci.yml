# CI — en cada push/PR: build web + suites en Chrome headless y casos WebP en WebKit + motor Rust.
# El runner de tests usa el Chrome preinstalado del runner de GitHub
# (playwright-core channel "chrome"), sin descargar navegadores.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (build + tests en Chrome)
    # Fijado: en ubuntu-latest (26.04) Playwright no soporta webkit (CI rojo 2026-11-03).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo: lastmod real y test de frescura del manifiesto
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps webkit
      - run: npm test
      - run: npm run build
      - run: npm run test:web

  rust:
    name: Rust (photocut-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p photocut-core
