<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <title>PhotoCut Studio — Editor</title>

    <!-- Herramienta, no página de SEO: no debe competir con la landing ("/")
         por el mismo contenido/keywords (T-011). -->
    <meta name="robots" content="noindex" />

    <!-- PWA -->
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Cpath d='M16 5a11 11 0 1 1 0 22z' fill='%23d6f64b'/%3E%3Cpath d='M16 5a11 11 0 0 0 0 22z' fill='none' stroke='%23d6f64b' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Datos estructurados: describen la herramienta para buscadores y para la
         revisión de AdSense (qué es, que es gratis y qué hace). No compite por
         indexación porque la página es noindex; es señal de legitimidad. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "PhotoCut Studio",
      "url": "https://www.photocutapp.com/editor/",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web (cualquier navegador moderno con WebAssembly)",
      "description": "Editor de fotos gratis que funciona 100% en tu navegador: quitar y cambiar el fondo con IA, recortar, censurar caras, aplicar filtros y marca de agua, crear iconos de app, extraer la paleta de color y convertir o comprimir imágenes. Las fotos nunca se suben a un servidor.",
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "inLanguage": ["es", "en", "pt"],
      "featureList": [
        "Quitar el fondo con IA (recorte automático)",
        "Cambiar el fondo por un color o una imagen",
        "Censurar y difuminar caras o datos",
        "Filtros y ajustes de imagen",
        "Marca de agua",
        "Anotar con flechas y formas",
        "Iconos de app y favicons",
        "Paleta de color desde una imagen",
        "Convertir y comprimir (PNG, JPG, WebP)",
        "Redimensionar imágenes"
      ],
      "publisher": {
        "@type": "Organization",
        "name": "PhotoCut Studio",
        "url": "https://www.photocutapp.com/"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Se suben mis fotos a un servidor?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. Todo el procesamiento ocurre dentro de tu navegador (WebAssembly y un modelo de IA local). Las imágenes nunca salen de tu equipo." }
        },
        {
          "@type": "Question",
          "name": "¿PhotoCut Studio es gratis?",
          "acceptedAnswer": { "@type": "Answer", "text": "Sí. Es gratis, sin límite de usos y sin marca de agua en las exportaciones." }
        },
        {
          "@type": "Question",
          "name": "¿Necesito instalar algo o crear una cuenta?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. Se usa directamente en el navegador, sin instalar programas ni registrarse." }
        },
        {
          "@type": "Question",
          "name": "¿En qué formatos puedo exportar?",
          "acceptedAnswer": { "@type": "Answer", "text": "PNG (con transparencia), WebP y JPG. También podés redimensionar, comprimir y convertir entre formatos." }
        }
      ]
    }
    </script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3865058604661161" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
